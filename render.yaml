services:
  - type: web
    name: bundle-till-system
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bundle-till-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: TILL_NUMBER
        value: "1677484"
      - key: APP_BASE_URL
        sync: false
      - key: MPESA_ENV
        value: production
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_SHORTCODE
        value: "1677484"
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_C2B_CONFIRMATION_URL
        sync: false
      - key: MPESA_C2B_VALIDATION_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: BUNDLE_PROVIDER_MODE
        value: none
      - key: BUNDLE_PROVIDER_BASE_URL
        sync: false
      - key: BUNDLE_PROVIDER_API_KEY
        sync: false
      - key: BUNDLE_PROVIDER_PURCHASE_PATH
        value: /purchase
databases:
  - name: bundle-till-db
    plan: free
