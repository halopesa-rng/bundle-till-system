<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bundle Admin</title><link rel="stylesheet" href="/style.css"></head><body><div id="loginPanel" class="wrap"><div class="hero"><h1>Admin Login</h1><input id="u" class="input" placeholder="Username"><input id="p" class="input" type="password" placeholder="Password"><button class="btn" onclick="adminLogin()">Sign in</button><div id="loginMsg"></div></div></div><div id="adminApp" style="display:none"><div class="side"><aside class="sidebar"><div class="brand">BUNDLE ADMIN</div><div class="muted" style="font-size:11px;margin:0 10px 18px;color:#91a99b">Safaricom network • secure operations</div><a href="#dashboard">Dashboard</a><a href="#orders">Orders</a><a href="#transactions">Transactions</a><a href="#bundles">Bundles</a><a href="#logs">Logs</a><a href="/" target="_blank">Customer shop</a><a href="#" onclick="adminLogout()">Logout</a></aside><main class="main"><h1>Dashboard</h1><p class="muted">Monitor bundle sales, payments and delivery in one place.</p><div id="stats" class="stats"></div><section id="orders" class="card"><h2>Recent orders</h2><div id="ordersTable"></div></section><section id="transactions" class="card" style="margin-top:18px"><h2>Transactions</h2><input id="search" class="input" placeholder="Search receipt, phone or reference" oninput="loadTransactions()"><div id="txTable"></div></section><section id="bundles" class="card" style="margin-top:18px"><div class="row"><h2 style="margin-right:auto">Bundles</h2><button class="btn" onclick="addBundle()">Add bundle</button></div><div id="bundleTable"></div></section><section id="logs" class="card" style="margin-top:18px"><h2>Audit logs</h2><div id="logTable"></div></section></main></div></div><script src="/admin.js"></script></body></html>
