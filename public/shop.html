<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bundle Shop</title><link rel="stylesheet" href="/style.css"></head><body><div class="top"><div class="brand">BUNDLE SHOP</div><a href="/admin">Admin</a></div><main class="wrap"><section class="hero"><h1>Buy Data Bundles</h1><p class="muted">Select a bundle, enter the number that should receive it, then follow the payment instructions.</p><div id="status"></div></section><section><h2>Available bundles</h2><div id="bundles" class="grid"></div></section><section class="hero" style="margin-top:22px"><h2>Check order</h2><div class="row"><input class="input" id="ref" placeholder="Order reference"><button class="btn secondary" onclick="checkOrder()">Check status</button></div><div id="orderStatus"></div></section></main><div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle">Buy bundle</h2><p id="modalBundle" class="muted"></p><label>Recipient phone number</label><input id="phone" class="input" placeholder="0712345678" inputmode="tel"><button class="btn" onclick="createOrder()">Create order</button> <button class="btn secondary" onclick="closeModal()">Cancel</button><div id="modalMsg"></div></div></div><script src="/shop.js"></script></body></html>
