<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Waiting for Approval</title><link rel="stylesheet" href="/style.css"></head>
<body class="shop-body"><main class="container section" style="min-height:80vh;display:flex;align-items:center;justify-content:center"><div class="status-card" style="width:min(520px,100%);text-align:center"><div class="payment-icon">⌁</div><span class="eyebrow green-text">PAYMENT CONFIRMATION</span><h1>Waiting for approval</h1><p class="muted">Your payment confirmation has been sent to our admin. Please wait while your order is approved.</p><div id="orderInfo" class="notice success">Checking your order…</div><div id="orderStatus" class="notice success" style="margin-top:12px">⏳ Waiting for admin approval…</div><p class="muted" style="margin-top:18px">Please keep this page open. You will see a success message when your bundle is delivered.</p></div></main><script>
const ref=new URLSearchParams(location.search).get('ref');let tries=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function check(){if(!ref){document.getElementById('orderStatus').className='notice error';document.getElementById('orderStatus').textContent='Order reference is missing.';return;}try{const r=await fetch('/api/orders/'+encodeURIComponent(ref));const d=await r.json();if(!r.ok)throw new Error(d.error||'Order not found');document.getElementById('orderInfo').innerHTML='<b>Order:</b> '+esc(d.order_reference)+'<br><b>Bundle:</b> '+esc(d.bundle_name)+'<br><b>Amount:</b> KES '+Number(d.amount).toFixed(0);if(d.delivery_status==='DELIVERED'){document.getElementById('orderStatus').innerHTML='<b>🎉 Your bundle was successfully bought and delivered!</b>';clearInterval(timer);}else if(d.payment_status==='FAILED'){document.getElementById('orderStatus').className='notice error';document.getElementById('orderStatus').textContent='Payment/order was rejected. Please contact support.';clearInterval(timer);}else if(d.delivery_status==='FAILED'){document.getElementById('orderStatus').className='notice error';document.getElementById('orderStatus').textContent='Delivery failed. Admin will retry it.';clearInterval(timer);}else{document.getElementById('orderStatus').className='notice success';document.getElementById('orderStatus').innerHTML='⏳ <b>Waiting for admin approval…</b><br>Your bundle will be delivered after approval.';}}catch(e){document.getElementById('orderStatus').className='notice error';document.getElementById('orderStatus').textContent=e.message;}if(++tries>=200)clearInterval(timer);}
check();const timer=setInterval(check,3000);
</script></body></html>
